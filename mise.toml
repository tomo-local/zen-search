[tools]
node = "20.20.2"
"npm:pnpm" = "10.34.5"
go = "1.27.0"

[tasks.service]
description = "Create a new service"
run = "go run ./scripts/tool/cmd gen:service"

[tasks.component]
description = "Create a new React component"
run = "go run ./scripts/tool/cmd gen:component"

[tasks.release]
description = "Create a new release"
run = "pnpm run release"